name: Deploy

# One Worker serves the app and the rooms, so every push to main deploys both, together.
on:
  push:
    branches: [main]

# One deploy at a time: a push made while another deploys waits for it instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named by packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Writes dist/client (the pages), dist/tricks (the Worker) and .wrangler/deploy/config.json,
      # which points wrangler deploy at the built Worker and its generated config.
      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
